<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#072a45">
  <meta name="description" content="Ask a question. Get a dry Australian answer.">
  <title>Aussie AI</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <span class="mini">AUSTRALIAN INTELLIGENCE</span>
        <h1>Aussie AI</h1>
      </div>
      <button id="settingsButton" class="gear" aria-label="Voice settings">⚙</button>
    </header>

    <section class="prompt-card">
      <label for="question">Ask anything</label>
      <textarea id="question" rows="4" maxlength="500" placeholder="How many boxes of goon do I bring to a funeral?"></textarea>
      <div class="prompt-actions">
        <button id="micButton" class="btn ghost" type="button">🎙 Speak</button>
        <button id="askButton" class="btn primary" type="button">Ask</button>
      </div>
    </section>

    <section class="reply-card" aria-live="polite">
      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p id="loadingText">Checking whether that is socially survivable...</p>
      </div>

      <div id="answerContent">
        <blockquote id="answer">Go on then.</blockquote>
        <p id="plainAnswer" class="plain"></p>
        <div class="reply-actions">
          <button id="againButton" class="btn ghost" type="button">Another answer</button>
          <button id="speakButton" class="btn ghost" type="button">🔊 Read it</button>
        </div>
      </div>
    </section>

    <p class="footer-note">Parody. It may be Australian, but it is not advice from Australia.</p>
  </main>

  <dialog id="settingsDialog">
    <form method="dialog">
      <div class="dialog-head">
        <h2>Voice</h2>
        <button class="close" value="cancel" aria-label="Close">✕</button>
      </div>
      <label for="voiceSelect">Available voice</label>
      <select id="voiceSelect"></select>
      <label for="voiceRate">Speed</label>
      <input id="voiceRate" type="range" min=".75" max="1.15" step=".05" value=".9">
      <label for="voicePitch">Pitch</label>
      <input id="voicePitch" type="range" min=".75" max="1.15" step=".05" value=".9">
      <button id="testVoiceButton" class="btn ghost full" type="button">Test voice</button>
      <p class="voice-note">This site can only use voices your phone exposes. A natural Australian voice needs a hosted neural voice service.</p>
    </form>
  </dialog>

  <div id="toast" class="toast hidden"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
